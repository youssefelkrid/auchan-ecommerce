<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
     <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section>
        
      <aside class="hidden md:flex md:flex-col flex-[2] bg-white border-r p-4">
        <a href="index.html" class="flex items-center gap-2 mb-8">


          <div class="flex">
            <img class="w-7" src="/auchan-ecommerce/img/markit.png" alt="">
            <span class="text-xl font-bold">Auchan Web</span>
          </div>
        </a>

        <nav class="flex flex-col gap-1">
          <div class="flex ">
            <a class="flex items-center gap-3 p-2 rounded-lg bg-red-50 text-red-600 font-medium" href="index.html">
              Catalogue
            </a>
            <img class="w-7" src="img/brochure.png" alt="">
          </div>
          <div class="flex">
            <a class="flex items-center gap-3 p-2 rounded-lg text-gray-600 hover:bg-gray-100" href="administration.html">
              Administration
            </a>
            <img class="w-7" src="img/administration.png" alt="">
          </div>
          <div class="flex">
            <a class="flex items-center gap-3 p-2 rounded-lg text-gray-600 hover:bg-gray-100" href="Contact.html">
               CONTACT-NOUS
            </a>
            <img class="w-7" src="img/gmail.png" alt="">
          </div>
        </nav>
      </aside>
    </section>
    <div class="flex justify-center items-center min-h-screen bg-gray-100">
  <form action="" class="bg-white p-6 w-96 rounded shadow">

    <h1 class="text-2xl font-bold text-center mb-4">Contactez-nous</h1>

    <div class="mb-3">
      <label for="nom" class="block">Nom complet</label>
      <input id="nom" type="text" placeholder="Nom complet" class="border w-full p-2">
    </div>

    <div class="mb-3">
      <label for="email" class="block">Adresse E-Mail</label>
      <input id="email" type="email" placeholder="Adresse E-Mail" class="border w-full p-2">
    </div>

    <div class="mb-3">
      <label for="tel" class="block">Numéro de téléphone</label>
      <input id="tel" type="text" placeholder="Numéro de téléphone" class="border w-full p-2">
    </div>

    <div class="mb-3">
      <label for="message" class="block">Votre Message</label>
      <textarea id="message" rows="4" placeholder="Votre message" class="border w-full p-2"></textarea>
    </div>

    <button type="submit" class="bg-red-600 text-white p-2 w-full rounded">
      Envoyer le message
    </button>

  </form>
</div>
    
</body>
</html>
