<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centre Commercial AUCHAN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-gray-50 text-gray-900">

  <header class="bg-gray-100 p-4 flex items-center justify-between gap-4">


    <img class="w-32" src="/auchan-ecommerce/img/logo.svg" alt="logo de cite web">


    <div class="flex   rounded-lg border bg-white px-3 py-1 w-[40%]">
      <img class="w-9" src="img/rechercher.png" alt="">
      <input type="text" placeholder="Rechercher des produits..."
        class="flex-1 max-w-lg bg-white p-2  outline-none text-black w-[80%]">
    </div>

    <div class="flex items-center gap-4 text-xl">
      <div class="relative cursor-pointer">
        <img class="w-10" src="img/panier.png" alt="">
        <span class="absolute -top-2 -right-2 bg-red-600 text-white text-xs px-1.5 rounded-full">3</span>
      </div>
      <span class="cursor-pointer"></span>
      <span class="text-gray-300">|</span>
    </div>

  </header>

  <main>

    <section class="flex min-h-screen">

      <aside class="hidden md:flex md:flex-col flex-[2] bg-white border-r p-4">
        <a href="index.html" class="flex items-center gap-2 mb-8">


          <div class="flex">
            <img class="w-7" src="/auchan-ecommerce/img/markit.png" alt="">
            <span class="text-xl font-bold">Auchan Web</span>
          </div>
        </a>

        <nav class="flex flex-col gap-1">
          <div class="flex ">
            <a class="flex items-center gap-3 p-2 rounded-lg bg-red-50 text-red-600 font-medium">
              Catalogue
            </a>
            <img class="w-7" src="img/brochure.png" alt="">
          </div>
          <div class="flex">
            <a class="flex items-center gap-3 p-2 rounded-lg text-gray-600 hover:bg-gray-100">
              Administration
            </a>
            <img class="w-7" src="img/administration.png" alt="">
          </div>
        </nav>
      </aside>

      <div class="flex-[8] min-w-0 flex flex-col">

        <header class="bg-gray-100 p-4 flex items-center justify-between gap-4">
          ...
        </header>

        <main class="flex-1 p-4 md:p-6">
          <section class="bg-white border rounded-xl p-3 flex flex-col gap-3 lg:flex-row lg:items-center">


            <div id="category-filters" class="flex gap-1 overflow-x-auto bg-gray-100 rounded-lg p-1">
              <button data-category="Tous"
                class="category-btn px-3 py-1.5 rounded-md text-sm whitespace-nowrap bg-white text-red-600 font-medium shadow-sm">
                Tous
              </button>

              <button data-category="Maison"
                class="category-btn px-3 py-1.5 rounded-md text-sm whitespace-nowrap text-gray-600 hover:bg-white">
                Maison
              </button>
              <button data-category="Produits Laitiers"
                class="category-btn px-3 py-1.5 rounded-md text-sm whitespace-nowrap text-gray-600 hover:bg-white">
                Produits Laitiers
              </button>
              <button data-category="Boissons"
                class="category-btn px-3 py-1.5 rounded-md text-sm whitespace-nowrap text-gray-600 hover:bg-white">
                Boissons
              </button>
            </div>

            <div class=" flex   rounded-lg border bg-white px-3 py-1 w-[40%]">
              <img class="w-9" src=" img/rechercher.png" alt="">
              <input id="category-search" type="text" placeholder=" Filtrer dans la catégorie..."
                class="flex-1 bg-gray-100 p-2 rounded-lg outline-none text-sm">
            </div>

            <div class="hidden lg:block w-px h-8 bg-gray-300"></div>





            <div class="flex gap-1 bg-gray-100 rounded-lg p-1 self-start lg:self-auto">
              <button id="btn-grid" class="px-3 py-1.5 rounded-md bg-white shadow-sm" title="Grille">▦</button>
              <button id="btn-list" class="px-3 py-1.5 rounded-md text-gray-600" title="Liste">☰</button>
            </div>

          </section>
          <h1>Catalogue de produits</h1>
          <div class="flex flex-row flex-wrap" id="produits">
            <article class="bg-white rounded-xl shadow-sm border overflow-hidden flex flex-col w-80" 
              data-id="1">


              <img src="/auchan-ecommerce/img/pomme.jpg" alt="" class="w-full aspect-square object-cover">

              <div class="p-4 flex flex-col gap-2 flex-1">




                <h3 class="font-medium">Pommes Gala Bio</h3>

                <div class="flex items-end justify-between mt-auto pt-2">
                  <div>
                    <p class="text-xs text-gray-500">Prix TTC</p>
                    <p class="text-xl font-bold">3.49 <span class="text-sm">€</span></p>
                  </div>

                </div>

              </div>
            </article>





















          </div>
        </main>

      </div>

    </section>


    </div>


  </main>

  <script type="module" src="js/main.js "></script>
</body>

</html>
